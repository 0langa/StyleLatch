name: Feature request
description: Propose a capability StyleLatch does not have yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that StyleLatch makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Existing styles, modifiers, or directives you already attempted.
